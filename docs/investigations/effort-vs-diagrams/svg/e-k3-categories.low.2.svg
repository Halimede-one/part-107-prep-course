<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 560 330' width='560' height='330'>
<rect x='0' y='0' width='560' height='330' fill='#ffffff'/>
<text x='8' y='18' font-family='sans-serif' font-size='12' font-weight='bold'>Categories of operation over people</text>
<line x1='8' y1='28' x2='552' y2='28' stroke='#333333' stroke-width='1'/>
<text x='8' y='46' font-family='sans-serif' font-size='11' font-weight='bold'>Aircraft must be</text>
<rect x='8' y='54' width='132' height='96' fill='#eef4fb' stroke='#333333'/>
<rect x='144' y='54' width='132' height='96' fill='#eef4fb' stroke='#333333'/>
<rect x='280' y='54' width='132' height='96' fill='#eef4fb' stroke='#333333'/>
<rect x='416' y='54' width='136' height='96' fill='#eef4fb' stroke='#333333'/>
<text x='16' y='70' font-family='sans-serif' font-size='11' font-weight='bold'>Category 1</text>
<text x='16' y='88' font-family='sans-serif' font-size='10'>0.55 lb or less</text>
<text x='16' y='104' font-family='sans-serif' font-size='10'>no exposed rotating</text>
<text x='16' y='118' font-family='sans-serif' font-size='10'>parts that could</text>
<text x='16' y='132' font-family='sans-serif' font-size='10'>lacerate skin</text>
<text x='16' y='146' font-family='sans-serif' font-size='10'>no declaration</text>
<text x='152' y='70' font-family='sans-serif' font-size='11' font-weight='bold'>Category 2</text>
<text x='152' y='88' font-family='sans-serif' font-size='10'>injury no worse than</text>
<text x='152' y='102' font-family='sans-serif' font-size='10'>11 ft-lb of kinetic</text>
<text x='152' y='116' font-family='sans-serif' font-size='10'>energy transfer</text>
<text x='152' y='134' font-family='sans-serif' font-size='10'>declaration of</text>
<text x='152' y='146' font-family='sans-serif' font-size='10'>compliance + label</text>
<text x='288' y='70' font-family='sans-serif' font-size='11' font-weight='bold'>Category 3</text>
<text x='288' y='88' font-family='sans-serif' font-size='10'>injury no worse than</text>
<text x='288' y='102' font-family='sans-serif' font-size='10'>25 ft-lb of kinetic</text>
<text x='288' y='116' font-family='sans-serif' font-size='10'>energy transfer</text>
<text x='288' y='134' font-family='sans-serif' font-size='10'>declaration of</text>
<text x='288' y='146' font-family='sans-serif' font-size='10'>compliance + label</text>
<text x='424' y='70' font-family='sans-serif' font-size='11' font-weight='bold'>Category 4</text>
<text x='424' y='88' font-family='sans-serif' font-size='10'>airworthiness</text>
<text x='424' y='102' font-family='sans-serif' font-size='10'>certificate</text>
<text x='424' y='120' font-family='sans-serif' font-size='10'>flown within flight</text>
<text x='424' y='134' font-family='sans-serif' font-size='10'>manual operating</text>
<text x='424' y='148' font-family='sans-serif' font-size='10'>limits</text>
<text x='8' y='176' font-family='sans-serif' font-size='11' font-weight='bold'>May fly over people</text>
<rect x='8' y='184' width='132' height='112' fill='#f2faf2' stroke='#333333'/>
<rect x='144' y='184' width='132' height='112' fill='#f2faf2' stroke='#333333'/>
<rect x='280' y='184' width='132' height='112' fill='#fdf3f1' stroke='#333333'/>
<rect x='416' y='184' width='136' height='112' fill='#f2faf2' stroke='#333333'/>
<text x='16' y='202' font-family='sans-serif' font-size='10'>over people with no</text>
<text x='16' y='216' font-family='sans-serif' font-size='10'>added operating</text>
<text x='16' y='230' font-family='sans-serif' font-size='10'>restriction</text>
<text x='152' y='202' font-family='sans-serif' font-size='10'>over people with no</text>
<text x='152' y='216' font-family='sans-serif' font-size='10'>added operating</text>
<text x='152' y='230' font-family='sans-serif' font-size='10'>restriction</text>
<text x='288' y='202' font-family='sans-serif' font-size='10'>never over open-air</text>
<text x='288' y='216' font-family='sans-serif' font-size='10'>assemblies</text>
<text x='288' y='234' font-family='sans-serif' font-size='10'>sustained flight only</text>
<text x='288' y='248' font-family='sans-serif' font-size='10'>in a closed- or</text>
<text x='288' y='262' font-family='sans-serif' font-size='10'>restricted-access site</text>
<text x='288' y='276' font-family='sans-serif' font-size='10'>where all are on</text>
<text x='288' y='290' font-family='sans-serif' font-size='10'>notice, or over</text>
<text x='424' y='202' font-family='sans-serif' font-size='10'>over people within</text>
<text x='424' y='216' font-family='sans-serif' font-size='10'>the flight manual</text>
<text x='424' y='230' font-family='sans-serif' font-size='10'>limits</text>
<text x='8' y='314' font-family='sans-serif' font-size='10'>Category 3 continued: participating or protected people only.</text>
<text x='8' y='326' font-family='sans-serif' font-size='10'>Categories 1, 2, 4: sustained flight over an open-air assembly only if the aircraft meets remote ID (Part 89).</text>
</svg>
