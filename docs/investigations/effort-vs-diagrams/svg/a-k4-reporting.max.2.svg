<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 560 440' width='560' height='440'>
<rect x='20' y='20' width='300' height='56' rx='8' fill='#eef2f7' stroke='#334155' stroke-width='1.5'/>
<text x='170' y='44' text-anchor='middle' font-family='sans-serif' font-size='12.5' fill='#111111'>Serious injury to any person,</text>
<text x='170' y='62' text-anchor='middle' font-family='sans-serif' font-size='12.5' fill='#111111'>or any loss of consciousness?</text>
<line x1='320' y1='48' x2='350' y2='48' stroke='#334155' stroke-width='1.5'/>
<polygon points='350,43 360,48 350,53' fill='#334155'/>
<text x='335' y='42' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#475569'>Yes</text>
<rect x='360' y='20' width='190' height='56' rx='8' fill='#fdf0f0' stroke='#9b3030' stroke-width='1.5'/>
<text x='455' y='43' text-anchor='middle' font-family='sans-serif' font-size='12.5' fill='#111111'>Report to the FAA</text>
<text x='455' y='61' text-anchor='middle' font-family='sans-serif' font-size='12.5' fill='#111111'>within 10 calendar days</text>
<line x1='170' y1='76' x2='170' y2='130' stroke='#334155' stroke-width='1.5'/>
<polygon points='165,130 170,140 175,130' fill='#334155'/>
<text x='178' y='108' font-family='sans-serif' font-size='11' fill='#475569'>No</text>
<rect x='20' y='140' width='300' height='56' rx='8' fill='#eef2f7' stroke='#334155' stroke-width='1.5'/>
<text x='170' y='164' text-anchor='middle' font-family='sans-serif' font-size='12.5' fill='#111111'>Damage to property other than</text>
<text x='170' y='182' text-anchor='middle' font-family='sans-serif' font-size='12.5' fill='#111111'>the small unmanned aircraft?</text>
<line x1='320' y1='168' x2='350' y2='168' stroke='#334155' stroke-width='1.5'/>
<polygon points='350,163 360,168 350,173' fill='#334155'/>
<text x='335' y='162' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#475569'>No</text>
<rect x='360' y='140' width='190' height='56' rx='8' fill='#f0f7f0' stroke='#2f7a3a' stroke-width='1.5'/>
<text x='455' y='173' text-anchor='middle' font-family='sans-serif' font-size='12.5' fill='#111111'>No report required</text>
<line x1='170' y1='196' x2='170' y2='250' stroke='#334155' stroke-width='1.5'/>
<polygon points='165,250 170,260 175,250' fill='#334155'/>
<text x='178' y='228' font-family='sans-serif' font-size='11' fill='#475569'>Yes</text>
<rect x='20' y='260' width='300' height='72' rx='8' fill='#eef2f7' stroke='#334155' stroke-width='1.5'/>
<text x='170' y='283' text-anchor='middle' font-family='sans-serif' font-size='12.5' fill='#111111'>Repair cost (materials and labor),</text>
<text x='170' y='301' text-anchor='middle' font-family='sans-serif' font-size='12.5' fill='#111111'>or fair market value if a total loss,</text>
<text x='170' y='319' text-anchor='middle' font-family='sans-serif' font-size='12.5' fill='#111111'>exceeds $500?</text>
<line x1='320' y1='296' x2='350' y2='296' stroke='#334155' stroke-width='1.5'/>
<polygon points='350,291 360,296 350,301' fill='#334155'/>
<text x='335' y='290' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#475569'>Yes</text>
<rect x='360' y='268' width='190' height='56' rx='8' fill='#fdf0f0' stroke='#9b3030' stroke-width='1.5'/>
<text x='455' y='291' text-anchor='middle' font-family='sans-serif' font-size='12.5' fill='#111111'>Report to the FAA</text>
<text x='455' y='309' text-anchor='middle' font-family='sans-serif' font-size='12.5' fill='#111111'>within 10 calendar days</text>
<line x1='170' y1='332' x2='170' y2='366' stroke='#334155' stroke-width='1.5'/>
<polygon points='165,366 170,376 175,366' fill='#334155'/>
<text x='178' y='354' font-family='sans-serif' font-size='11' fill='#475569'>No</text>
<rect x='20' y='376' width='300' height='46' rx='8' fill='#f0f7f0' stroke='#2f7a3a' stroke-width='1.5'/>
<text x='170' y='404' text-anchor='middle' font-family='sans-serif' font-size='12.5' fill='#111111'>No report required</text>
</svg>
