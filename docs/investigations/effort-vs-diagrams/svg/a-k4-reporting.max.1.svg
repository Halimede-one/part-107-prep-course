<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 560 540' width='560' height='540'>
  <rect x='0' y='0' width='560' height='540' fill='#ffffff'/>
  <g font-family='sans-serif' font-size='12.5' fill='#111111' text-anchor='middle'>
    <rect x='150' y='12' width='260' height='36' rx='18' fill='#eef2f7' stroke='#475569' stroke-width='1.5'/>
    <text x='280' y='35'>An accident during your operation</text>
    <line x1='280' y1='48' x2='280' y2='80' stroke='#475569' stroke-width='1.5'/>
    <polygon points='274,80 286,80 280,88' fill='#475569'/>

    <rect x='90' y='88' width='380' height='52' rx='6' fill='#f8fafc' stroke='#475569' stroke-width='1.5'/>
    <text x='280' y='110'>Serious injury to any person,</text>
    <text x='280' y='128'>or any loss of consciousness?</text>

    <line x1='470' y1='114' x2='520' y2='114' stroke='#475569' stroke-width='1.5'/>
    <line x1='520' y1='114' x2='520' y2='460' stroke='#475569' stroke-width='1.5'/>
    <polygon points='514,460 526,460 520,468' fill='#475569'/>
    <text x='495' y='106' font-size='11.5' fill='#334155'>Yes</text>

    <line x1='280' y1='140' x2='280' y2='164' stroke='#475569' stroke-width='1.5'/>
    <polygon points='274,164 286,164 280,172' fill='#475569'/>
    <text x='297' y='158' font-size='11.5' fill='#334155'>No</text>

    <rect x='90' y='172' width='380' height='52' rx='6' fill='#f8fafc' stroke='#475569' stroke-width='1.5'/>
    <text x='280' y='194'>Damage to property other than</text>
    <text x='280' y='212'>the small unmanned aircraft itself?</text>

    <line x1='90' y1='198' x2='40' y2='198' stroke='#475569' stroke-width='1.5'/>
    <line x1='40' y1='198' x2='40' y2='460' stroke='#475569' stroke-width='1.5'/>
    <polygon points='34,460 46,460 40,468' fill='#475569'/>
    <text x='66' y='190' font-size='11.5' fill='#334155'>No</text>

    <line x1='280' y1='224' x2='280' y2='248' stroke='#475569' stroke-width='1.5'/>
    <polygon points='274,248 286,248 280,256' fill='#475569'/>
    <text x='300' y='242' font-size='11.5' fill='#334155'>Yes</text>

    <rect x='90' y='256' width='380' height='56' rx='6' fill='#f8fafc' stroke='#475569' stroke-width='1.5'/>
    <text x='280' y='278'>Repair cost, including materials and labor, or</text>
    <text x='280' y='296'>fair market value if a total loss, exceeds $500?</text>

    <line x1='90' y1='284' x2='40' y2='284' stroke='#475569' stroke-width='1.5'/>
    <text x='66' y='276' font-size='11.5' fill='#334155'>No</text>

    <line x1='280' y1='312' x2='280' y2='460' stroke='#475569' stroke-width='1.5'/>
    <polygon points='274,460 286,460 280,468' fill='#475569'/>
    <text x='300' y='392' font-size='11.5' fill='#334155'>Yes</text>

    <rect x='20' y='468' width='210' height='56' rx='6' fill='#eef7ee' stroke='#2f6b33' stroke-width='1.5'/>
    <text x='125' y='490'>No report to the FAA</text>
    <text x='125' y='508'>is required</text>

    <rect x='250' y='468' width='290' height='56' rx='6' fill='#fdeeee' stroke='#9b2c2c' stroke-width='1.5'/>
    <text x='395' y='490'>Report to the FAA</text>
    <text x='395' y='508'>within 10 calendar days</text>
  </g>
</svg>
