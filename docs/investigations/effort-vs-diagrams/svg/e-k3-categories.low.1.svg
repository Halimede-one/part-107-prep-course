  <text x='153' y='232' font-family='sans-serif' font-size='10'>sustained flight</text>
  <text x='153' y='245' font-family='sans-serif' font-size='10'>over an open-air</text>
  <text x='153' y='258' font-family='sans-serif' font-size='10'>assembly</text>
  <text x='290' y='206' font-family='sans-serif' font-size='10'>Never over an</text>
  <text x='290' y='219' font-family='sans-serif' font-size='10'>open-air assembly</text>
  <text x='290' y='236' font-family='sans-serif' font-size='10'>Sustained flight</text>
  <text x='290' y='249' font-family='sans-serif' font-size='10'>only in a closed or</text>
