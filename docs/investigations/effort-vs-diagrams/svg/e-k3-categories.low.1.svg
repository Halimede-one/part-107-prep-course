  <text x='427' y='206' font-family='sans-serif' font-size='10'>Same remote ID</text>
  <text x='427' y='219' font-family='sans-serif' font-size='10'>condition for</text>
  <text x='427' y='232' font-family='sans-serif' font-size='10'>sustained flight</text>
  <text x='427' y='245' font-family='sans-serif' font-size='10'>over an open-air</text>
  <text x='427' y='258' font-family='sans-serif' font-size='10'>assembly</text>
  <text x='10' y='300' font-family='sans-serif' font-size='10'>Outside the categories: people directly participating, or under a covered structure</text>
  <text x='10' y='313' font-family='sans-serif' font-size='10'>or inside a stationary vehicle that provides reasonable protection.</text>
