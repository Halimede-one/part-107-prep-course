<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 560 400' width='560' height='400'>
  <defs>
    <marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'>
      <path d='M 0 0 L 10 5 L 0 10 z' fill='#333'/>
    </marker>
  </defs>
  <g font-family='sans-serif' font-size='13' fill='#111'>
    <rect x='50' y='12' width='240' height='38' fill='#ffffff' stroke='#333'/>
    <text x='170' y='36' text-anchor='middle'>Accident during an operation</text>
    <line x1='170' y1='50' x2='170' y2='68' stroke='#333' marker-end='url(#ar)'/>

    <rect x='50' y='70' width='240' height='46' rx='8' fill='#ffffff' stroke='#333'/>
    <text x='170' y='89' text-anchor='middle'>Serious injury to any person,</text>
    <text x='170' y='105' text-anchor='middle'>or any loss of consciousness?</text>

    <line x1='290' y1='93' x2='328' y2='93' stroke='#333' marker-end='url(#ar)'/>
    <text x='296' y='86' font-size='12'>Yes</text>

    <rect x='330' y='70' width='215' height='46' fill='#ffffff' stroke='#333'/>
    <text x='437' y='89' text-anchor='middle'>Report to the FAA</text>
    <text x='437' y='105' text-anchor='middle'>within 10 calendar days</text>

    <line x1='170' y1='116' x2='170' y2='148' stroke='#333' marker-end='url(#ar)'/>
    <text x='176' y='136' font-size='12'>No</text>

    <rect x='50' y='150' width='240' height='46' rx='8' fill='#ffffff' stroke='#333'/>
    <text x='170' y='169' text-anchor='middle'>Damage to property other than</text>
    <text x='170' y='185' text-anchor='middle'>the small unmanned aircraft?</text>

    <line x1='170' y1='196' x2='170' y2='228' stroke='#333' marker-end='url(#ar)'/>
    <text x='176' y='216' font-size='12'>Yes</text>

    <rect x='50' y='230' width='240' height='46' rx='8' fill='#ffffff' stroke='#333'/>
    <text x='170' y='249' text-anchor='middle'>Repair cost or fair market value</text>
    <text x='170' y='265' text-anchor='middle'>exceeds $500?</text>

    <polyline points='290,253 437,253 437,120' fill='none' stroke='#333' marker-end='url(#ar)'/>
    <text x='296' y='246' font-size='12'>Yes</text>

    <polyline points='50,173 20,173 20,352 46,352' fill='none' stroke='#333' marker-end='url(#ar)'/>
    <text x='24' y='166' font-size='12'>No</text>
    <polyline points='50,253 20,253' fill='none' stroke='#333'/>
    <text x='24' y='246' font-size='12'>No</text>

    <rect x='50' y='332' width='240' height='38' fill='#ffffff' stroke='#333'/>
    <text x='170' y='356' text-anchor='middle'>No report required</text>
  </g>
</svg>
