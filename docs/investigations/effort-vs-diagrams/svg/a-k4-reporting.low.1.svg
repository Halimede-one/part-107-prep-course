<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 540 420' width='540' height='420'>
  <rect x='150' y='10' width='240' height='44' rx='6' fill='#eef3fb' stroke='#3a5a8c'/>
  <text x='270' y='38' text-anchor='middle' font-family='sans-serif' font-size='14' fill='#17304f'>An accident happened</text>
  <line x1='270' y1='54' x2='270' y2='84' stroke='#3a5a8c' stroke-width='2'/>
  <rect x='70' y='84' width='400' height='60' rx='6' fill='#fff8e6' stroke='#8c6d1f'/>
  <text x='270' y='108' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#4a3a08'>Serious injury to any person,</text>
  <text x='270' y='128' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#4a3a08'>or any loss of consciousness?</text>
  <text x='300' y='168' font-family='sans-serif' font-size='12' fill='#17304f'>No</text>
  <line x1='270' y1='144' x2='270' y2='186' stroke='#3a5a8c' stroke-width='2'/>
  <line x1='470' y1='114' x2='516' y2='114' stroke='#3a5a8c' stroke-width='2'/>
  <text x='493' y='106' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#17304f'>Yes</text>
  <line x1='516' y1='114' x2='516' y2='350' stroke='#3a5a8c' stroke-width='2'/>
  <line x1='516' y1='350' x2='420' y2='350' stroke='#3a5a8c' stroke-width='2'/>
  <rect x='40' y='186' width='460' height='80' rx='6' fill='#fff8e6' stroke='#8c6d1f'/>
  <text x='270' y='210' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#4a3a08'>Damage to property other than the small unmanned aircraft,</text>
  <text x='270' y='230' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#4a3a08'>with repair cost or fair market value</text>
  <text x='270' y='250' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#4a3a08'>that exceeds $500?</text>
  <text x='128' y='292' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#17304f'>No</text>
  <line x1='150' y1='266' x2='150' y2='320' stroke='#3a5a8c' stroke-width='2'/>
  <text x='300' y='292' font-family='sans-serif' font-size='12' fill='#17304f'>Yes</text>
  <line x1='270' y1='266' x2='270' y2='320' stroke='#3a5a8c' stroke-width='2'/>
  <rect x='30' y='320' width='170' height='60' rx='6' fill='#eef7ee' stroke='#2f6b33'/>
  <text x='115' y='344' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1d4720'>No FAA report</text>
  <text x='115' y='364' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1d4720'>required</text>
  <rect x='230' y='320' width='190' height='60' rx='6' fill='#fdeeee' stroke='#8c2f2f'/>
  <text x='325' y='344' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#5a1414'>Report to the FAA</text>
  <text x='325' y='364' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#5a1414'>within 10 calendar days</text>
</svg>
