<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 560 380' width='560' height='380'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M 0 0 L 10 5 L 0 10 z' fill='#333'/></marker></defs>
<g font-family='sans-serif' font-size='12' fill='#111' text-anchor='middle'>
<rect x='100' y='8' width='240' height='34' rx='17' fill='#eef3fb' stroke='#333'/>
<text x='220' y='30'>Accident during an operation</text>
<line x1='220' y1='42' x2='220' y2='58' stroke='#333' marker-end='url(#a)'/>
<rect x='20' y='60' width='320' height='48' fill='#fff' stroke='#333'/>
<text x='180' y='80'>Serious injury to any person,</text>
<text x='180' y='96'>or any loss of consciousness?</text>
<line x1='180' y1='108' x2='180' y2='134' stroke='#333' marker-end='url(#a)'/>
<text x='192' y='124' text-anchor='start'>No</text>
<rect x='20' y='138' width='320' height='48' fill='#fff' stroke='#333'/>
<text x='180' y='158'>Damage to property other than</text>
<text x='180' y='174'>the small unmanned aircraft?</text>
<line x1='340' y1='162' x2='356' y2='162' stroke='#333' marker-end='url(#a)'/>
<text x='342' y='155' text-anchor='start'>No</text>
<rect x='360' y='140' width='160' height='44' fill='#f2f2f2' stroke='#333'/>
<text x='440' y='167'>No report required</text>
<line x1='180' y1='186' x2='180' y2='212' stroke='#333' marker-end='url(#a)'/>
<text x='192' y='202' text-anchor='start'>Yes</text>
<rect x='20' y='216' width='320' height='62' fill='#fff' stroke='#333'/>
<text x='180' y='236'>Repair cost, including materials and labor,</text>
<text x='180' y='252'>over $500 — or fair market value over</text>
<text x='180' y='268'>$500 if the property is a total loss?</text>
<polyline points='340,247 440,247 440,188' fill='none' stroke='#333' marker-end='url(#a)'/>
<text x='346' y='240' text-anchor='start'>No</text>
<line x1='180' y1='278' x2='180' y2='308' stroke='#333' marker-end='url(#a)'/>
<text x='192' y='296' text-anchor='start'>Yes</text>
<rect x='20' y='312' width='400' height='52' fill='#eef3fb' stroke='#333'/>
<text x='220' y='333'>Report to the FAA within 10 calendar days:</text>
<text x='220' y='351'>DroneZone or the nearest Flight Standards District Office</text>
<polyline points='340,84 540,84 540,338 424,338' fill='none' stroke='#333' marker-end='url(#a)'/>
<text x='346' y='77' text-anchor='start'>Yes</text>
</g>
</svg>
