<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 560 330' width='560' height='330'>
  <rect x='0' y='0' width='560' height='330' fill='#ffffff'/>
  <text x='8' y='14' font-family='sans-serif' font-size='11' font-weight='bold' fill='#222'>Categories of operation over people</text>

  <rect x='8' y='24' width='130' height='26' fill='#dce9f7' stroke='#4a6d8c'/>
  <rect x='146' y='24' width='130' height='26' fill='#dce9f7' stroke='#4a6d8c'/>
  <rect x='284' y='24' width='130' height='26' fill='#dce9f7' stroke='#4a6d8c'/>
  <rect x='422' y='24' width='130' height='26' fill='#dce9f7' stroke='#4a6d8c'/>
  <text x='73' y='42' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1b3b55'>Category 1</text>
  <text x='211' y='42' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1b3b55'>Category 2</text>
  <text x='349' y='42' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1b3b55'>Category 3</text>
  <text x='487' y='42' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1b3b55'>Category 4</text>

  <text x='8' y='64' font-family='sans-serif' font-size='10' font-weight='bold' fill='#444'>What the aircraft must be or carry</text>
  <rect x='8' y='70' width='130' height='86' fill='#f6f9fc' stroke='#9fb3c4'/>
  <rect x='146' y='70' width='130' height='86' fill='#f6f9fc' stroke='#9fb3c4'/>
  <rect x='284' y='70' width='130' height='86' fill='#f6f9fc' stroke='#9fb3c4'/>
  <rect x='422' y='70' width='130' height='86' fill='#f6f9fc' stroke='#9fb3c4'/>

  <text x='14' y='85' font-family='sans-serif' font-size='10' fill='#222'>0.55 pounds or less</text>
  <text x='14' y='99' font-family='sans-serif' font-size='10' fill='#222'>No exposed rotating</text>
  <text x='14' y='112' font-family='sans-serif' font-size='10' fill='#222'>parts that could</text>
  <text x='14' y='125' font-family='sans-serif' font-size='10' fill='#222'>lacerate skin</text>
  <text x='14' y='144' font-family='sans-serif' font-size='10' fill='#222'>No declaration</text>

  <text x='152' y='85' font-family='sans-serif' font-size='10' fill='#222'>Would not cause</text>
  <text x='152' y='98' font-family='sans-serif' font-size='10' fill='#222'>injury worse than a</text>
  <text x='152' y='111' font-family='sans-serif' font-size='10' fill='#222'>transfer of 11 foot-</text>
  <text x='152' y='124' font-family='sans-serif' font-size='10' fill='#222'>pounds of kinetic</text>
  <text x='152' y='137' font-family='sans-serif' font-size='10' fill='#222'>energy. Accepted</text>
  <text x='152' y='150' font-family='sans-serif' font-size='10' fill='#222'>declaration + label</text>

  <text x='290' y='85' font-family='sans-serif' font-size='10' fill='#222'>Same limit raised to</text>
  <text x='290' y='98' font-family='sans-serif' font-size='10' fill='#222'>25 foot-pounds of</text>
  <text x='290' y='111' font-family='sans-serif' font-size='10' fill='#222'>kinetic energy.</text>
  <text x='290' y='130' font-family='sans-serif' font-size='10' fill='#222'>Accepted</text>
  <text x='290' y='143' font-family='sans-serif' font-size='10' fill='#222'>declaration + label</text>

  <text x='428' y='85' font-family='sans-serif' font-size='10' fill='#222'>Holds an</text>
  <text x='428' y='98' font-family='sans-serif' font-size='10' fill='#222'>airworthiness</text>
  <text x='428' y='111' font-family='sans-serif' font-size='10' fill='#222'>certificate</text>
  <text x='428' y='130' font-family='sans-serif' font-size='10' fill='#222'>Flown within the</text>
  <text x='428' y='143' font-family='sans-serif' font-size='10' fill='#222'>flight manual limits</text>

  <text x='8' y='174' font-family='sans-serif' font-size='10' font-weight='bold' fill='#444'>Where it may fly over people</text>
  <rect x='8' y='180' width='130' height='140' fill='#eef7ee' stroke='#7fa37f'/>
  <rect x='146' y='180' width='130' height='140' fill='#eef7ee' stroke='#7fa37f'/>
  <rect x='284' y='180' width='130' height='140' fill='#fbeeee' stroke='#b58585'/>
  <rect x='422' y='180' width='130' height='140' fill='#eef7ee' stroke='#7fa37f'/>

  <text x='14' y='196' font-family='sans-serif' font-size='10' fill='#222'>Over people</text>
  <text x='14' y='215' font-family='sans-serif' font-size='10' fill='#222'>Sustained flight over</text>
  <text x='14' y='228' font-family='sans-serif' font-size='10' fill='#222'>an open-air assembly</text>
  <text x='14' y='241' font-family='sans-serif' font-size='10' fill='#222'>only if the aircraft</text>
  <text x='14' y='254' font-family='sans-serif' font-size='10' fill='#222'>meets the remote</text>
  <text x='14' y='267' font-family='sans-serif' font-size='10' fill='#222'>identification</text>
  <text x='14' y='280' font-family='sans-serif' font-size='10' fill='#222'>requirement of Part 89</text>

  <text x='152' y='196' font-family='sans-serif' font-size='10' fill='#222'>Over people</text>
  <text x='152' y='215' font-family='sans-serif' font-size='10' fill='#222'>Sustained flight over</text>
  <text x='152' y='228' font-family='sans-serif' font-size='10' fill='#222'>an open-air assembly</text>
  <text x='152' y='241' font-family='sans-serif' font-size='10' fill='#222'>only if the aircraft</text>
  <text x='152' y='254' font-family='sans-serif' font-size='10' fill='#222'>meets the remote</text>
  <text x='152' y='267' font-family='sans-serif' font-size='10' fill='#222'>identification</text>
  <text x='152' y='280' font-family='sans-serif' font-size='10' fill='#222'>requirement of Part 89</text>

  <text x='290' y='196' font-family='sans-serif' font-size='10' font-weight='bold' fill='#7a2222'>Never over an</text>
  <text x='290' y='209' font-family='sans-serif' font-size='10' font-weight='bold' fill='#7a2222'>open-air assembly</text>
  <text x='290' y='228' font-family='sans-serif' font-size='10' fill='#222'>Sustained flight over</text>
  <text x='290' y='241' font-family='sans-serif' font-size='10' fill='#222'>people only within a</text>
  <text x='290' y='254' font-family='sans-serif' font-size='10' fill='#222'>closed- or restricted-</text>
  <text x='290' y='267' font-family='sans-serif' font-size='10' fill='#222'>access site where all</text>
  <text x='290' y='280' font-family='sans-serif' font-size='10' fill='#222'>are on notice, or only</text>
  <text x='290' y='293' font-family='sans-serif' font-size='10' fill='#222'>over people who are</text>
  <text x='290' y='306' font-family='sans-serif' font-size='10' fill='#222'>participating/protected</text>

  <text x='428' y='196' font-family='sans-serif' font-size='10' fill='#222'>Over people</text>
  <text x='428' y='215' font-family='sans-serif' font-size='10' fill='#222'>Sustained flight over</text>
  <text x='428' y='228' font-family='sans-serif' font-size='10' fill='#222'>an open-air assembly</text>
  <text x='428' y='241' font-family='sans-serif' font-size='10' fill='#222'>only if the aircraft</text>
  <text x='428' y='254' font-family='sans-serif' font-size='10' fill='#222'>meets the remote</text>
  <text x='428' y='267' font-family='sans-serif' font-size='10' fill='#222'>identification</text>
  <text x='428' y='280' font-family='sans-serif' font-size='10' fill='#222'>requirement of Part 89</text>
</svg>
