<g font-family='sans-serif' font-size='11' fill='#111111'>
<text x='10' y='24' font-weight='bold'>Category</text>
<text x='90' y='24' font-weight='bold'>What the aircraft must be</text>
<text x='302' y='24' font-weight='bold'>Where it may fly over people</text>
<text x='10' y='50' font-weight='bold'>Cat. 1</text>
<text x='90' y='50'>0.55 pounds or less, with no exposed</text>
<text x='90' y='64'>rotating parts that could lacerate</text>
<text x='90' y='78'>skin. No declaration needed.</text>
<text x='302' y='50'>Over people. Sustained flight over an</text>
<text x='302' y='64'>open-air assembly only if the aircraft meets</text>
<text x='302' y='78'>the remote identification requirement.</text>
<text x='10' y='104' font-weight='bold'>Cat. 2</text>
<text x='90' y='104'>No injury worse than a transfer of</text>
<text x='90' y='118'>11 foot-pounds of kinetic energy.</text>
<text x='90' y='132'>Declaration of compliance and label.</text>
<text x='302' y='104'>Over people. Sustained flight over an</text>
<text x='302' y='118'>open-air assembly only if the aircraft meets</text>
<text x='302' y='132'>the remote identification requirement.</text>
<text x='10' y='158' font-weight='bold'>Cat. 3</text>
<text x='90' y='158'>No injury worse than a transfer of</text>
<text x='90' y='172'>25 foot-pounds of kinetic energy.</text>
<text x='90' y='186'>Declaration of compliance and label.</text>
<text x='302' y='158'>Never over an open-air assembly.</text>
<text x='302' y='172'>Sustained flight over people only within</text>
<text x='302' y='186'>a closed- or restricted-access site where</text>
<text x='302' y='200'>everyone is on notice, or over people who</text>
<text x='302' y='214'>are participating or protected.</text>
<text x='10' y='240' font-weight='bold'>Cat. 4</text>
<text x='90' y='240'>Holds an airworthiness certificate.</text>
<text x='90' y='254'>Flown within the operating limits in</text>
<text x='90' y='268'>the flight manual.</text>
<text x='302' y='240'>Over people. Sustained flight over an</text>
<text x='302' y='254'>open-air assembly only if the aircraft meets</text>
<text x='302' y='268'>the remote identification requirement.</text>
</g>
