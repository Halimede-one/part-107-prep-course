<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 560 420' width='560' height='420'>
  <rect x='0' y='0' width='560' height='420' fill='#ffffff'/>
  <g font-family='sans-serif' font-size='13' fill='#1a1a1a'>
    <rect x='160' y='12' width='240' height='40' rx='6' fill='#e8eef7' stroke='#36507a'/>
    <text x='280' y='37' text-anchor='middle'>An accident happened during the flight</text>
    <line x1='280' y1='52' x2='280' y2='82' stroke='#36507a'/>
    <polygon points='280,90 274,80 286,80' fill='#36507a'/>

    <polygon points='280,90 470,140 280,190 90,140' fill='#fdf3e0' stroke='#8a6a24'/>
    <text x='280' y='132' text-anchor='middle'>Serious injury to any person,</text>
    <text x='280' y='150' text-anchor='middle'>or any loss of consciousness?</text>

    <text x='486' y='134' text-anchor='middle' font-weight='bold'>Yes</text>
    <line x1='470' y1='140' x2='520' y2='140' stroke='#36507a'/>
    <line x1='520' y1='140' x2='520' y2='330' stroke='#36507a'/>
    <polygon points='520,338 514,328 526,328' fill='#36507a'/>

    <text x='268' y='208' text-anchor='end' font-weight='bold'>No</text>
    <line x1='280' y1='190' x2='280' y2='222' stroke='#36507a'/>
    <polygon points='280,230 274,220 286,220' fill='#36507a'/>

    <polygon points='280,230 500,290 280,350 60,290' fill='#fdf3e0' stroke='#8a6a24'/>
    <text x='280' y='272' text-anchor='middle'>Damage to property other than the small</text>
    <text x='280' y='290' text-anchor='middle'>unmanned aircraft, with repair cost or fair</text>
    <text x='280' y='308' text-anchor='middle'>market value over $500?</text>

    <text x='268' y='368' text-anchor='end' font-weight='bold'>No</text>
    <line x1='280' y1='350' x2='280' y2='362' stroke='#36507a'/>
    <polygon points='280,370 274,360 286,360' fill='#36507a'/>
    <rect x='140' y='370' width='180' height='40' rx='6' fill='#eef6ec' stroke='#2f6b33'/>
    <text x='230' y='395' text-anchor='middle'>No report required</text>

    <text x='470' y='282' text-anchor='middle' font-weight='bold'>Yes</text>
    <line x1='500' y1='290' x2='520' y2='290' stroke='#36507a'/>

    <rect x='350' y='338' width='200' height='56' rx='6' fill='#fbeaea' stroke='#8a2b2b'/>
    <text x='450' y='362' text-anchor='middle'>Report to the FAA within</text>
    <text x='450' y='380' text-anchor='middle'>10 calendar days</text>
  </g>
</svg>
