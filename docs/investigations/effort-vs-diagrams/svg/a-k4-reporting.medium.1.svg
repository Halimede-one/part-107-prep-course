<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 560 470' width='560' height='470'>
  <defs>
    <marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'>
      <path d='M0,0 L10,5 L0,10 z' fill='#333'/>
    </marker>
  </defs>
  <g font-family='sans-serif' font-size='13' fill='#111'>
    <rect x='140' y='10' width='280' height='44' rx='8' fill='#eef2f7' stroke='#33516e'/>
    <text x='280' y='29' text-anchor='middle'>An operation under Part 107</text>
    <text x='280' y='46' text-anchor='middle'>caused injury or damage</text>

    <line x1='280' y1='54' x2='280' y2='84' stroke='#333' marker-end='url(#a)'/>

    <rect x='90' y='86' width='380' height='60' rx='8' fill='#fff' stroke='#33516e'/>
    <text x='280' y='110' text-anchor='middle'>Serious injury to any person,</text>
    <text x='280' y='128' text-anchor='middle'>or any loss of consciousness?</text>

    <line x1='470' y1='116' x2='520' y2='116' stroke='#333'/>
    <line x1='520' y1='116' x2='520' y2='380' stroke='#333'/>
    <line x1='520' y1='380' x2='450' y2='380' stroke='#333' marker-end='url(#a)'/>
    <text x='476' y='108' font-size='12'>Yes</text>

    <line x1='280' y1='146' x2='280' y2='176' stroke='#333' marker-end='url(#a)'/>
    <text x='288' y='166' font-size='12'>No</text>

    <rect x='60' y='178' width='440' height='78' rx='8' fill='#fff' stroke='#33516e'/>
    <text x='280' y='202' text-anchor='middle'>Damage to property other than the small</text>
    <text x='280' y='220' text-anchor='middle'>unmanned aircraft, where repair cost (materials</text>
    <text x='280' y='238' text-anchor='middle'>and labor) or fair market value exceeds $500?</text>

    <line x1='500' y1='217' x2='520' y2='217' stroke='#333'/>
    <text x='470' y='270' font-size='12'>Yes</text>
    <line x1='280' y1='256' x2='280' y2='290' stroke='#333' marker-end='url(#a)'/>
    <text x='288' y='278' font-size='12'>No</text>

    <rect x='110' y='292' width='340' height='44' rx='8' fill='#f3f3f3' stroke='#777'/>
    <text x='280' y='320' text-anchor='middle'>No report to the FAA required</text>

    <rect x='110' y='356' width='340' height='48' rx='8' fill='#e8f3ea' stroke='#2f6b40'/>
    <text x='280' y='376' text-anchor='middle'>Report to the FAA within</text>
    <text x='280' y='394' text-anchor='middle'>10 calendar days</text>

    <text x='280' y='438' text-anchor='middle' font-size='12' fill='#444'>Damage to the small unmanned aircraft itself does not count.</text>
  </g>
</svg>
