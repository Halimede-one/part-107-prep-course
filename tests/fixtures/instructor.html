<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Instructor workspace check</title>
<link rel="stylesheet" href="../../ui/styles.css">
</head>
<body>

<!-- Loaded by tests/test_instructor_page.py. Runs ui/instructor.js over the
     course page's own markup, with the server's replies and the functions
     app.js shares stubbed here, and writes PASS, or one line per failed check,
     into #result. Loaded with ?questions, it checks the Questions tab instead
     of a lesson file. -->
<pre id="result">NOT RUN</pre>

<script>
// The course page's markup: index.html's body up to its scripts.
var page = new XMLHttpRequest();
page.open("GET", "../../ui/index.html", false);
page.send();
document.write(page.responseText.match(/<body>([\s\S]*?)<script/)[1]);
</script>
<script src="../../ui/marked.min.js"></script>
<script src="../../ui/markdown.js"></script>
<script src="../../ui/instructor.js"></script>
<script src="../../ui/dictation.js"></script>
<script>
(function () {
  "use strict";
  var UNIT = "UA.I.B.K21b";
  var GUIDED = "---\nsource: 14 CFR 107.51 | https://www.ecfr.gov/current/title-14/section-107.51\n---\nThe Guided lesson.\n";
  var REVISION = "---\nsource: 14 CFR 107.51 | https://www.ecfr.gov/current/title-14/section-107.51\n---\nStep 1, the limit.\n\n" +
                 "```svg Altitude above a tower\n<svg viewBox='0 0 10 10' width='10' height='10'><rect width='10' height='10'/></svg>\n```\n";
  var SOURCE = { source: "14 CFR 107.51", url: "https://www.ecfr.gov/current/title-14/section-107.51" };
  var ITEM = { item: UNIT + "-i1", unit: UNIT, stem: "What is the highest you may fly?", a: "200 feet", b: "400 feet",
               c: "500 feet", answer: "B", rationale: "107.51 sets 400 feet.", source: SOURCE.source, url: SOURCE.url };
  var GUIDANCE = "Make sure the student understands the structure exception.";
  var sent = [], asked = [], tried = [], refreshed = 0, failures = [], questionSaves = 0, confirmAnswer = true;
  function check(name, ok) { if (!ok) { failures.push(name); } }
  function $(id) { return document.getElementById(id); }

  // The server's replies.
  function info(gear, text) {
    return { unit: UNIT, gear: gear, title: "b. Altitude limitations.", text: text, guided: GUIDED,
             files: { "1": null, "2": { version: null, draft: false }, "3": text ? { version: 1, draft: false } : null },
             status: { "gear 3": text ? "v1 edited" : "" } };
  }
  window.confirm = function () { return confirmAnswer; };
  window.fetch = function (url, options) {
    var body = options && options.body ? JSON.parse(options.body) : null, reply;
    sent.push({ url: url, body: body });
    if (url.indexOf("/api/author/questions?") === 0) {
      reply = { unit: UNIT, title: "b. Altitude limitations.", guidance: GUIDANCE, items: [ITEM], sources: [SOURCE] };
    } else if (url === "/api/author/questions") {
      // The first save is refused, as the server refuses a question with no answer.
      reply = ++questionSaves === 1 ? { error: "Nothing was saved. Fix these first.", problems: ["Question 2: the answer must be A, B or C"] }
        : { saved: true, unit: UNIT, title: "b. Altitude limitations.", guidance: body.guidance.trim(), sources: [SOURCE],
            items: body.items.map(function (q, i) { return Object.assign({}, q, { unit: UNIT, item: q.item || UNIT + "-i" + (i + 1) }); }) };
    } else if (url.indexOf("/api/author?") === 0) {
      var gear = Number(/gear=(\d)/.exec(url)[1]);
      reply = info(gear, gear === 2 ? GUIDED : "");
    } else if (url === "/api/author/save") {
      reply = { saved: true, version: 1, images: ["images/" + UNIT + "-1.svg"], warnings: [],
                file: info(body.gear, body.text.replace(/```svg[\s\S]*?```/, "![Altitude above a tower](images/" + UNIT + "-1.svg)")) };
    }
    return Promise.resolve({ json: function () { return Promise.resolve(reply); } });
  };

  // What app.js shares, in small.
  function el(tag, attrs, kids) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k === "class" ? "class" : k, attrs[k]); });
    [].concat(kids == null ? [] : kids).forEach(function (c) {
      if (c != null) { node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
    });
    return node;
  }

  // A stand-in for the browser's speech recognition, as in dictation.html: it
  // records the calls, and the checks fire its events.
  var made = [];
  function FakeRecognition() { this.calls = []; made.push(this); }
  ["start", "stop", "abort"].forEach(function (name) {
    FakeRecognition.prototype[name] = function () { this.calls.push(name); };
  });
  window.SpeechRecognition = window.webkitSpeechRecognition = FakeRecognition;
  function latest() { return made[made.length - 1]; }
  function say(r, transcripts) { r.onresult({ results: transcripts.map(function (t) { return [{ transcript: t }]; }) }); }
  // A listening button is red: the same background as a box styled with --bad.
  function red(button) {
    var probe = document.body.appendChild(document.createElement("div"));
    probe.style.background = "var(--bad)";
    var same = getComputedStyle(button).backgroundColor === getComputedStyle(probe).backgroundColor;
    probe.remove();
    return same;
  }
  // The chat's microphone, attached before the workspace's, as app.js does.
  Dictation.attach($("chat-mic"), $("chat-input"), function () {});

  Instructor.init({
    el: el,
    citations: function (cites) { return cites.length ? el("div", { class: "citations" }, cites.map(function (c) { return el("a", { href: c.url }, c.source); })) : null; },
    indicator: function () { return { node: el("div", { class: "status" }), status: function () {}, writing: function () {}, stop: function () {} }; },
    streamInto: function (target, text) { target.textContent += text; },
    streamRequest: function (what, url, payload, onEvent) {
      asked.push(payload);
      onEvent({ start: { stage: "author", status: "Revising the lesson", model: "mock", block: {} } });
      onEvent({ delta: "I added a diagram.", field: "note" });
      // Changes, the usual reply: only the note streams, and the proposal comes with the end.
      return Promise.resolve({ done: true, note: "I added a diagram.", text: REVISION,
                               diff: ["--- editor", "+++ proposal", "@@ -1,4 +1,6 @@", "-The Guided lesson.", "+Step 1, the limit."] });
    },
    units: function () { return [{ id: "UA.I.B.K21a", number: "2.21a", title: "a. Maximum groundspeed." }, { id: UNIT, number: "2.21b", title: "b. Altitude limitations." }]; },
    here: function () { return { unit: UNIT, gear: 3 }; },
    refresh: function () { refreshed++; },
    tryIt: function (unit, gear) { tried.push([unit, gear]); }
  });

  // The steps, each after the last one's requests have settled.
  var steps = [
    function () {
      $("instructor-btn").hidden = false;
      $("chat-mic").click();  // the chat's microphone listens when the workspace opens
      $("instructor-btn").click();
    },
    function () {
      check("opening the workspace stops the chat's microphone", made[0].calls.join() === "start,abort");
      check("the assistant has a microphone", !$("author-mic").hidden);
      check("the workspace opens", !$("author").hidden);
      check("on the unit on screen", $("author-unit").value === UNIT);
      check("at the gear on screen", document.querySelector(".author-gears [aria-selected=true]").getAttribute("data-gear") === "3");
      check("the unit list has every unit", $("author-unit").options.length === 2);
      check("a gear with no file says so", $("author-file").textContent.indexOf("No file") === 0);
      check("and offers a start", !$("author-empty").hidden && !$("author-from-guided").hidden);
      $("author-from-guided").click();
      check("the Guided lesson fills the editor", $("author-text").value === GUIDED);
      check("as an unsaved change", !$("author-dirty").hidden);
      check("the preview shows it", $("author-preview").textContent.indexOf("The Guided lesson.") >= 0);
      check("with its sources", $("author-preview").querySelector(".citations a").textContent === "14 CFR 107.51");
      $("author-mic").click();
      var spoken = latest();
      say(spoken, ["Add a diagram"]);
      check("spoken words go into the request box", $("author-request").value === "Add a diagram");
      check("the listening button is red", red($("author-mic")));
      $("author-request").value = "Add a diagram of the altitude limit.";
      $("author-form").requestSubmit();
      check("Send stops listening", spoken.calls.join() === "start,abort");
      say(spoken, ["Add a diagram of"]);
      check("and late words do not come back", $("author-request").value === "");
    },
    function () {
      check("the request carries the editor text", asked[0] && asked[0].text === GUIDED && asked[0].gear === 3);
      check("and the request", asked[0] && asked[0].request === "Add a diagram of the altitude limit.");
      check("the proposal shows in the preview", !$("author-proposal").hidden && $("author-preview").classList.contains("proposal"));
      check("with its drawing", $("author-preview").querySelectorAll("img.drawn").length === 1);
      check("the editor is not changed yet", $("author-text").value === GUIDED);
      check("the note is in the assistant column", $("author-log").textContent.indexOf("I added a diagram.") >= 0);
      check("with the changes counted", $("author-log").querySelector("summary").textContent === "Changes: 1 lines added, 1 removed");
      $("author-mic").click();
      latest().onerror({ error: "not-allowed" });
      var failed = $("author-log").lastChild;
      check("a microphone failure shows in the assistant column", failed.classList.contains("error") && /permission/.test(failed.textContent));
      $("author-apply").click();
      check("Apply puts the proposal in the editor", $("author-text").value === REVISION && $("author-proposal").hidden);
      $("author-mic").click();
      var listening = latest();
      $("author-save").click();
      check("Save asks first", $("author-save-dialog").open);
      check("Save stops listening", listening.calls.join() === "start,abort");
      $("author-note").value = "Added a diagram.";
      document.querySelector("#author-save-dialog button[value=edited]").click();
      check("the dialog closes", !$("author-save-dialog").open);
    },
    function () {
      var save = sent.filter(function (s) { return s.url === "/api/author/save"; })[0];
      check("the save sends the file", save && save.body.text === REVISION && save.body.unit === UNIT && save.body.gear === 3);
      check("with the note, not vetted", save && save.body.note === "Added a diagram." && save.body.vetted === false);
      check("the editor shows the saved file", $("author-text").value.indexOf("](images/" + UNIT + "-1.svg)") >= 0);
      check("with no unsaved change", $("author-dirty").hidden);
      check("the message says so", $("author-message").textContent.indexOf("Saved as version 1, not yet vetted.") === 0);
      check("the course map is drawn again", refreshed === 1);
      check("the file state is updated", $("author-file").textContent.indexOf("version 1") >= 0);
      $("author-mic").click();
      var listening = latest();
      $("author-try").click();
      check("Try it closes the workspace", $("author").hidden);
      check("and teaches the unit at that gear", tried.length === 1 && tried[0][0] === UNIT && tried[0][1] === 3);
      check("Try it stops listening", listening.calls.join() === "start,abort");
      $("instructor-btn").click();
    },
    function () {
      document.querySelector(".author-gears button[data-gear='2']").click();
    },
    function () {
      check("a tab loads that gear's file", $("author-text").value === GUIDED && $("author-empty").hidden);
      $("author-mic").click();
      var listening = latest();
      $("author").dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
      check("Escape closes the workspace", $("author").hidden);
      check("and stops listening", listening.calls.join() === "start,abort");
    }
  ];

  // The Questions tab, with ?questions.
  function fieldOf(node, name) { return node.querySelector("[data-field=" + name + "]"); }
  function type(input, value) { input.value = value; input.dispatchEvent(new Event("input", { bubbles: true })); }
  function shown(node) { return getComputedStyle(node).display !== "none"; }
  var listening = null;
  var questionSteps = [
    function () {
      $("instructor-btn").hidden = false;
      $("instructor-btn").click();
    },
    function () {
      check("the Questions tab is not a speed", !$("author-questions-tab").hasAttribute("data-gear"));
      $("author-mic").click();
      listening = latest();
      $("author-questions-tab").click();
    },
    function () {
      var cards = $("questions-list").children;
      check("the Questions tab hides the lesson columns", !shown(document.querySelector(".author-body")));
      check("and shows the questions", shown($("author-questions")));
      check("and hides Try it", !shown($("author-try")));
      check("opening it stops listening", listening.calls.join() === "start,abort");
      check("the tab is selected, and no speed", $("author-questions-tab").getAttribute("aria-selected") === "true" &&
            !document.querySelector(".author-gears button[data-gear][aria-selected=true]"));
      check("it asks for the unit on screen", sent[sent.length - 1].url === "/api/author/questions?unit=" + encodeURIComponent(UNIT));
      check("the guidance loads", $("questions-guidance").value === GUIDANCE);
      check("one card per question, with its id", cards.length === 1 &&
            cards[0].querySelector("legend").textContent === "Question 1 · " + UNIT + "-i1");
      check("and its fields", fieldOf(cards[0], "stem").value === ITEM.stem && fieldOf(cards[0], "b").value === "400 feet" &&
            fieldOf(cards[0], "source").value === SOURCE.source && fieldOf(cards[0], "url").value === SOURCE.url);
      check("and its answer marked", cards[0].querySelector("input[type=radio]:checked").value === "B");
      check("no unsaved change yet", $("questions-dirty").hidden);
      check("the file state counts the questions", $("author-file").textContent.indexOf("1 question, asked before the tutor writes its own") === 0);
      $("questions-add").click();
      $("questions-add").click();
      check("Add puts a new card at the end", cards.length === 3 && cards[2].querySelector("legend").textContent === "Question 3 · new");
      check("as an unsaved change", !$("questions-dirty").hidden);
      cards[1].querySelector(".question-delete").click();
      check("Delete removes a card and numbers the rest again", cards.length === 2 &&
            cards[1].querySelector("legend").textContent === "Question 2 · new");
      var fresh = cards[1], source = fieldOf(fresh, "source");
      type(fieldOf(fresh, "stem"), "How far from a structure may you fly above 400 feet?");
      type(fieldOf(fresh, "a"), "Within a 400-foot radius");
      type(fieldOf(fresh, "b"), "Within a 1,000-foot radius");
      type(fieldOf(fresh, "c"), "At any distance");
      type(fieldOf(fresh, "rationale"), "107.51 allows it within a 400-foot radius of the structure.");
      check("the source list offers the unit's sources", source.options.length === 2 && source.options[1].value === SOURCE.source);
      source.value = SOURCE.source;
      source.dispatchEvent(new Event("change", { bubbles: true }));
      check("choosing a source fills its link", fieldOf(fresh, "url").value === SOURCE.url);
      confirmAnswer = false;
      document.querySelector(".author-gears button[data-gear='2']").click();
      check("a refused discard keeps the questions", shown($("author-questions")) && cards.length === 2);
      confirmAnswer = true;
      $("author-save").click();  // the new card has no answer marked
    },
    function () {
      check("a refusal lists its problems", !$("questions-problems").hidden &&
            $("questions-problems").textContent === "Question 2: the answer must be A, B or C");
      check("and says nothing was saved", $("author-message").textContent === "Nothing was saved. Fix these first.");
      check("and keeps the edits", $("questions-list").children.length === 2 && !$("questions-dirty").hidden);
      $("questions-list").children[1].querySelector("input[type=radio][value=A]").click();
      $("author").dispatchEvent(new KeyboardEvent("keydown", { key: "s", ctrlKey: true, bubbles: true }));
    },
    function () {
      var post = sent.filter(function (s) { return s.url === "/api/author/questions"; })[1];
      var cards = $("questions-list").children;
      check("Ctrl+S saves the questions", !!post);
      check("with the unit and the guidance", post && post.body.unit === UNIT && post.body.guidance === GUIDANCE);
      check("the known question keeps its id and answer", post && post.body.items[0].item === UNIT + "-i1" && post.body.items[0].answer === "B");
      check("the new one has no id, and has its answer and link", post && post.body.items[1].item === "" &&
            post.body.items[1].answer === "A" && post.body.items[1].url === SOURCE.url);
      check("no lesson save is sent", !sent.some(function (s) { return s.url === "/api/author/save"; }));
      check("after the save the new card shows its id", cards[1].querySelector("legend").textContent === "Question 2 · " + UNIT + "-i2");
      check("with no unsaved change and no problems", $("questions-dirty").hidden && $("questions-problems").hidden);
      check("the message says so", $("author-message").textContent === "Saved the guidance and 2 questions.");
      document.querySelector(".author-gears button[data-gear='3']").click();
    },
    function () {
      check("the speed it came from brings the lesson back", shown(document.querySelector(".author-body")) && !shown($("author-questions")));
      check("with Try it", shown($("author-try")));
      check("and its tab selected", document.querySelector(".author-gears [aria-selected=true]").getAttribute("data-gear") === "3");
    }
  ];

  var flow = location.search === "?questions" ? questionSteps : steps;
  function run(i) {
    if (i === flow.length) {
      $("result").textContent = failures.length ? "FAIL\n" + failures.join("\n") : "PASS";
      return;
    }
    try { flow[i](); } catch (e) { failures.push("ERROR in step " + i + ": " + e.message); }
    setTimeout(function () { run(i + 1); }, 200);
  }
  window.addEventListener("load", function () { run(0); });
}());
</script>
</body>
</html>
